<!DOCTYPE html>
<!--
================================================================================
 WORK EXPERIENCE & GAPS ANALYSIS  (gap.htm)
================================================================================

 WHAT THIS FILE IS
 =================
 A single, self-contained webpage that shows:
   1. A company-wise work experience table.
   2. A company + gap detail table.
   3. Totals for experience and gaps.

 There is no build step, no dependency and no server requirement. All HTML, CSS
 and JavaScript live in this one file, so it can be opened directly in a browser
 or served as-is from GitHub Pages.

 WHERE THE DATA LIVES
 ====================
 Scroll to the <script> near the bottom and edit ONLY the "EDIT ONLY THIS BLOCK"
 section. Everything else is generated from that data when the page opens.

   const companies = [
      { name: "SITEL", start: "2010-09-14", end: "2011-03-30" },
      ...
   ];

 Each company object supports:

   name   (required)  Company name exactly as it should appear.
   start  (required)  Start date in YYYY-MM-DD format.
   end    (optional)  End date in YYYY-MM-DD format.
                      Leave it as "" or omit it for the current job.
   gap    (optional)  Reason for the gap BEFORE this company.
                      "MASTERS"       shows the gap row in yellow.
                      "HEALTH ISSUES" shows the gap row in orange.
                      Anything else / omitted shows a normal white gap row.

 The "trailingGap" constant sets the reason and colour of the final gap between
 the last company's end date and today:

   const trailingGap = "HEALTH ISSUES";

 ADD A COMPANY
 =============
 Copy any line inside the array, change the values and place it anywhere.
 Rows are sorted by start date automatically, so the order in the file does not
 matter. Example:

   { name: "NEW COMPANY", start: "2025-01-06", end: "2026-03-31" },

 For a current job (no end date), use an empty end:

   { name: "NEW COMPANY", start: "2026-04-01", end: "" },

 REMOVE A COMPANY
 ================
 Delete its line from the array. Its work-experience row and the gap row linked
 to it are removed automatically.

 WHAT IS CALCULATED AUTOMATICALLY
 ================================
 Company rows (both tables):
   - Start Date / End Date          formatted as DD-MM-YYYY
   - End Date                       shows "Present" when end is blank
   - Working Period                 end - start in days (current job: today - start)
   - Sum Up with Previous           running total of Working Period
   - Experience Per Company         Working Period converted to years/months/days

 Gap rows (second table):
   - Gap after a company            next company's start - this company's end
   - Final / trailing gap           today - last company's end
   - Gap Experience                 gap days converted to years/months/days
   - Gap colour                     taken from the next company's "gap" value
                                    (or "trailingGap" for the final gap)
   - Gaps of zero or less are hidden (overlapping dates)

 Summary rows:
   - Total Experience WO Current    sum of all companies that have an end date
   - Total Experience               sum of every company (current counted to today)
   - Total Experience After MSC     sum from the company after the MASTERS gap onward
   - Total Gap                      sum of every gap, including the trailing gap
   - Total Gap w/o MS               Total Gap minus the MASTERS gap
   - As on                          today's date, in long format

 Experience is converted using 365.25 days per year and 30.4375 days per month,
 with the remaining days rounded up. This matches the totals in the original
 Excel export.

 RENDERING NOTES
 ===============
   - Everything is rendered by the inline JavaScript into <tbody id="sheet-body">.
     Do not hand-edit the generated table rows; edit the data array instead.
   - The table is fixed at 765px wide. Wide screens centre it; narrow screens
     scroll the page horizontally, with the scrollbar at the bottom of the viewport.
   - "As on" and the trailing gap are recalculated every time the page is loaded
     or refreshed, so they stay current without editing the file.

 COMMON MISTAKES
 ===============
   - Dates must be YYYY-MM-DD (for example, 2026-11-07). DD-MM-YYYY will not parse.
   - Keep the comma after each { ... } object except the last one.
   - Keep names and dates in quotes.
   - If no company is tagged "MASTERS", then "After MSC" equals Total Experience
     and "Gap w/o MS" equals Total Gap.

 QUICK PREVIEW
 =============
 Open this file in a browser, or visit the GitHub Pages URL for this folder.

================================================================================
-->
<html lang="en">

<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Work Experience &amp; Gaps Analysis</title>
   <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png">
   <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
   <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png">
   <style>
      html {
         background-color: #000;
      }

      body {
         background-color: #000;
         color: #fff;
         font-family: Calibri, Arial, sans-serif;
         font-size: 11pt;
         margin: 0;
         padding: 16px;
      }

      .sheet {
         width: 765px;
         margin: 0 auto;
      }

      table {
         border-collapse: collapse;
         table-layout: fixed;
         width: 765px;
      }

      td {
         border: 1px solid #000;
         height: 20px;
         padding: 1px 4px;
         text-align: center;
         vertical-align: middle;
         white-space: nowrap;
      }

      .title {
         background: #E36C09;
         color: #fff;
         font-size: 14pt;
         height: 38px;
      }

      .head {
         background: #FFC000;
         color: #000;
         font-weight: 700;
      }

      .company {
         background: #000;
         color: #fff;
         font-weight: 700;
      }

      .gap {
         background: gray;
         color: #fff;
         font-weight: 700;
      }

      .gap.masters {
         color: #FFFF00;
      }

      .gap.health {
         color: #F79646;
      }

      .blank {
         background: #000;
         border-color: #000;
      }

      .summary-label {
         background: #000;
         color: #fff;
         font-weight: 700;
      }

      .summary-value {
         background: #92D050;
         color: #000;
         font-weight: 700;
      }

      .reason-masters {
         background: gray;
         color: #FFFF00;
         font-weight: 700;
      }

      .reason-health {
         background: gray;
         color: #F79646;
         font-weight: 700;
      }

      .ason {
         background: #FFC000;
         color: #000;
         font-weight: 700;
      }

      .email {
         display: inline-block;
         background-color: #000;
         color: #39ff14;
         padding: 5px 10px;
         text-decoration: none;
         border-radius: 5px;
         transition: background-color 0.3s, color 0.3s;
         font-family: Arial, sans-serif;
      }

      .email:hover {
         background-color: #39ff14;
         color: #000;
      }
   </style>
</head>

<body>
   <div class="sheet" align="center">
      <table>
         <colgroup>
            <col style="width:103px">
            <col style="width:73px">
            <col style="width:73px">
            <col style="width:191px">
            <col style="width:161px">
            <col style="width:164px">
         </colgroup>
         <tbody id="sheet-body"></tbody>
      </table>
      <br><br>
      <a class="email" href="../index.html" target="_blank"><b>&lt;&lt; GO BACK</b></a>
   </div>

   <script>
      /* =====================================================================
         EDIT ONLY THIS BLOCK
         ---------------------------------------------------------------------
         Add a company:    copy a line and change the values.
         Remove a company: delete its line.
         Dates:            use YYYY-MM-DD.
         end:              "" or omit it if you are still working there
                           (it will count up to today automatically).
         gap:              optional reason for the gap BEFORE this company.
                           "MASTERS" / "HEALTH ISSUES" only change the colour.
         Gaps, totals and the "As on" date are calculated automatically.
         ===================================================================== */
      const companies = [
         { name: "SITEL",        start: "2010-09-14", end: "2011-03-30" },
         { name: "SYMANTEC",     start: "2011-04-04", end: "2011-07-01" },
         { name: "DELL",         start: "2013-07-05", end: "2013-12-03", gap: "MASTERS" },
         { name: "MEDUSIND",     start: "2013-12-05", end: "2015-03-10" },
         { name: "GVW",          start: "2015-03-23", end: "2017-02-28" },
         { name: "ABCO / OPTUM", start: "2017-05-17", end: "2019-01-04" },
         { name: "AMAZON",       start: "2020-07-06", end: "2021-08-24", gap: "HEALTH ISSUES" },
         { name: "GLOWTOUCH",    start: "2022-09-19", end: "2023-10-11", gap: "HEALTH ISSUES" }
      ];

      // Gap between the last company's end date and today.
      const trailingGap = "HEALTH ISSUES";
      /* ===================================================================== */

      const DAY = 24 * 60 * 60 * 1000;
      const now = new Date();
      const TODAY = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());

      function parseDate(value) {
         const parts = value.split("-").map(Number);
         return Date.UTC(parts[0], parts[1] - 1, parts[2]);
      }

      function diffDays(from, to) {
         return Math.round((to - from) / DAY);
      }

      function formatDate(ms) {
         const d = new Date(ms);
         const dd = String(d.getUTCDate()).padStart(2, "0");
         const mm = String(d.getUTCMonth() + 1).padStart(2, "0");
         return dd + "-" + mm + "-" + d.getUTCFullYear();
      }

      function formatLongDate(ms) {
         return new Date(ms).toLocaleDateString("en-US", {
            timeZone: "UTC",
            year: "numeric",
            month: "long",
            day: "numeric"
         });
      }

      function toYearsMonthsDays(days) {
         days = Math.max(0, Math.round(days));
         let years = Math.floor(days / 365.25);
         const afterYears = days - years * 365.25;
         let months = Math.floor(afterYears / 30.4375);
         let rest = Math.ceil(afterYears - months * 30.4375);
         if (rest >= 31) {
            rest = 0;
            months += 1;
         }
         if (months >= 12) {
            months -= 12;
            years += 1;
         }
         return years + " years " + months + " months " + rest + " days";
      }

      function escapeHtml(value) {
         return String(value).replace(/[&<>"']/g, function (ch) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
         });
      }

      function reasonClass(reason) {
         const value = String(reason || "").toUpperCase();
         if (value.indexOf("MASTER") !== -1) return "masters";
         if (value.indexOf("HEALTH") !== -1) return "health";
         return "";
      }

      const rows = companies
         .map(function (company) {
            return {
               name: company.name,
               start: company.start,
               end: company.end || "",
               gap: company.gap || "",
               startMs: parseDate(company.start),
               endMs: company.end ? parseDate(company.end) : TODAY
            };
         })
         .sort(function (a, b) {
            return a.startMs - b.startMs;
         });

      let cumulative = 0;
      rows.forEach(function (row) {
         row.days = Math.max(0, diffDays(row.startMs, row.endMs));
         cumulative += row.days;
         row.cumulative = cumulative;
      });

      const gaps = rows.map(function (row, index) {
         const next = rows[index + 1];
         if (next) {
            const days = diffDays(row.endMs, next.startMs);
            return days > 0
               ? { from: row.endMs, to: next.startMs, days: days, reason: next.gap }
               : null;
         }
         if (row.end) {
            const days = diffDays(row.endMs, TODAY);
            return days > 0
               ? { from: row.endMs, to: TODAY, days: days, reason: trailingGap }
               : null;
         }
         return null;
      });

      const actualGaps = gaps.filter(Boolean);
      const totalGap = actualGaps.reduce(function (sum, gap) { return sum + gap.days; }, 0);
      const mastersGap = actualGaps.filter(function (gap) { return reasonClass(gap.reason) === "masters"; })[0];
      const mastersDays = mastersGap ? mastersGap.days : 0;
      const totalGapWithoutMasters = totalGap - mastersDays;

      const totalExperience = rows.reduce(function (sum, row) { return sum + row.days; }, 0);
      const totalExperienceWithoutCurrent = rows
         .filter(function (row) { return row.end; })
         .reduce(function (sum, row) { return sum + row.days; }, 0);
      const totalExperienceAfterMsc = mastersGap
         ? rows
            .filter(function (row) { return row.startMs >= mastersGap.to; })
            .reduce(function (sum, row) { return sum + row.days; }, 0)
         : totalExperience;

      function cell(text, className) {
         return "<td" + (className ? ' class="' + className + '"' : "") + ">" +
            (text === "" || text === undefined ? "&nbsp;" : text) + "</td>";
      }

      function blankRow() {
         return "<tr>" + cell("", "blank").repeat(6) + "</tr>";
      }

      function headerRow() {
         return "<tr>" +
            cell("Company", "head") +
            cell("Start Date", "head") +
            cell("End Date", "head") +
            cell("Working Period", "head") +
            cell("Sum Up with Previous", "head") +
            cell("Experience Per Company", "head") +
            "</tr>";
      }

      function summaryRow(label, value) {
         return "<tr>" +
            cell("", "blank") +
            cell("", "blank") +
            cell("", "blank") +
            cell(label, "summary-label") +
            cell(value, "summary-value") +
            cell("", "blank") +
            "</tr>";
      }

      function companyRow(row) {
         return "<tr>" +
            cell(escapeHtml(row.name), "company") +
            cell(formatDate(row.startMs), "company") +
            cell(row.end ? formatDate(row.endMs) : "Present", "company") +
            cell(row.days, "company") +
            cell(row.cumulative, "company") +
            cell(toYearsMonthsDays(row.days), "company") +
            "</tr>";
      }

      let html = "";
      html += '<tr><td colspan="6" class="title">WORK EXPERIENCE &amp; GAPS ANALYSIS</td></tr>';
      html += blankRow();
      html += headerRow();

      rows.forEach(function (row) {
         html += companyRow(row);
      });

      html += blankRow();
      html += summaryRow("Total Experience WO Current", toYearsMonthsDays(totalExperienceWithoutCurrent));
      html += summaryRow("Total Experience", toYearsMonthsDays(totalExperience));
      html += summaryRow("Total Experience After MSC", toYearsMonthsDays(totalExperienceAfterMsc));
      html += blankRow();
      html += headerRow();

      rows.forEach(function (row, index) {
         html += companyRow(row);
         const gap = gaps[index];
         if (gap) {
            const gapClass = "gap " + reasonClass(gap.reason);
            html += "<tr>" +
               cell("GAP", gapClass) +
               cell("", gapClass) +
               cell("", gapClass) +
               cell(gap.days, gapClass) +
               cell("", gapClass) +
               cell(toYearsMonthsDays(gap.days), gapClass) +
               "</tr>";
         }
      });

      html += blankRow();
      html += "<tr>" +
         cell("GAP REASON:", "gap") +
         cell("", "blank") +
         cell("", "blank") +
         cell("Total Gap", "summary-label") +
         cell(toYearsMonthsDays(totalGap), "summary-value") +
         cell("", "blank") +
         "</tr>";
      html += "<tr>" +
         cell("MASTERS", "reason-masters") +
         cell("", "blank") +
         cell("", "blank") +
         cell("Total Experience", "summary-label") +
         cell(toYearsMonthsDays(totalExperience), "summary-value") +
         cell("", "blank") +
         "</tr>";
      html += "<tr>" +
         cell("HEALTH ISSUES", "reason-health") +
         cell("", "blank") +
         cell("", "blank") +
         cell("Total Gap w/o MS", "summary-label") +
         cell(toYearsMonthsDays(totalGapWithoutMasters), "summary-value") +
         cell("", "blank") +
         "</tr>";
      html += "<tr>" +
         cell("", "blank") +
         cell("", "blank") +
         cell("", "blank") +
         cell("", "blank") +
         cell("", "blank") +
         cell("As on: " + formatLongDate(TODAY), "ason") +
         "</tr>";

      document.getElementById("sheet-body").innerHTML = html;
   </script>
</body>

</html>
